<script>
  (function(){
    const projects = [
      { title: "SKILL-SYNC – Job Recommender", description: "NLP & ML-based system matching user skills with 1000+ job titles using cosine similarity." },
      { title: "SamvaadX – Voice Interview Assistant", description: "GenAI voice assistant evaluating grammar, timing, and content relevance with 60% accuracy." },
      { title: "Om.ai – Cultural Chatbot", description: "Chatbot answering queries from 5+ Indian traditional knowledge disciplines with 72% accuracy." },
      { title: "Resume Evaluator Agent", description: "Langflow AI agent parsing resumes and job descriptions to improve job alignment by 40%." },
      { title: "Rust Detection", description: "OpenCV-based rust detection system for industrial applications." }
    ];

    const carouselTrack = document.getElementById('carouselTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const cardWidth = 260 + 20; // card width + gap
    let visibleCards = window.innerWidth <= 700 ? 1 : 3;
    let currentIndex = 0;

    function renderProjects() {
      carouselTrack.innerHTML = '';
      projects.forEach(proj => {
        const card = document.createElement('div');
        card.style.cssText = `
          background: rgba(0, 212, 255, 0.1);
          border: 1px solid #00d4ff;
          border-radius: 12px;
          min-width: 260px;
          max-width: 260px;
          padding: 20px;
          color: #00d4ff;
          box-shadow: 0 4px 15px rgba(0,212,255,0.3);
          user-select: none;
          flex-shrink: 0;
        `;
        card.innerHTML = `<h3 style="font-size: 1.2rem; margin-bottom: 12px; color: #00b1db;">${proj.title}</h3><p style="font-size:1rem; color:#c0e6ff; line-height:1.4;">${proj.description}</p>`;
        carouselTrack.appendChild(card);
      });
      updateCarousel();
    }

    function updateCarousel() {
      const maxIndex = Math.max(0, projects.length - visibleCards);
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex > maxIndex) currentIndex = maxIndex;

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === maxIndex;

      prevBtn.style.opacity = prevBtn.disabled ? "0.3" : "1";
      nextBtn.style.opacity = nextBtn.disabled ? "0.3" : "1";

      carouselTrack.style.transform = `translateX(${-currentIndex * cardWidth}px)`;
    }

    prevBtn.addEventListener('click', () => {
      currentIndex--;
      updateCarousel();
      resetAutoSlide();
    });

    nextBtn.addEventListener('click', () => {
      currentIndex++;
      updateCarousel();
      resetAutoSlide();
    });

    window.addEventListener('resize', () => {
      visibleCards = window.innerWidth <= 700 ? 1 : 3;
      updateCarousel();
    });

    let autoSlideInterval;
    function startAutoSlide() {
      autoSlideInterval = setInterval(() => {
        if (currentIndex < projects.length - visibleCards) {
          currentIndex++;
        } else {
          currentIndex = 0;
        }
        updateCarousel();
      }, 3000); // 3 seconds gap
    }

    function resetAutoSlide() {
      clearInterval(autoSlideInterval);
      startAutoSlide();
    }

    renderProjects();
    startAutoSlide();

  })();
</script>
